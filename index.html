    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _origFetch;
            },
            set: function(v) {
              _origFetch = typeof v === 'function' ? v : _origFetch;
            }
          });
        } catch (e) {}
        // Intercept extension injection errors from bubbling to app overlays
        window.addEventListener('error', function(event) {
          var isExtension = event.filename && (
            event.filename.indexOf('chrome-extension://') !== -1 ||
            event.filename.indexOf('moz-extension://') !== -1
          );
          var isFetchError = event.message && event.message.indexOf('fetch') !== -1;
          if (isExtension || isFetchError) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event.reason && (event.reason.message || event.reason.stack)) || '';
          if (msg.indexOf('chrome-extension://') !== -1 || msg.indexOf('fetch') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
