<!doctype html>
<html lang="vi" data-theme="purple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xuân Ken Music</title>
    <meta name="description" content="Nền tảng nghe nhạc trực tuyến" />
    <meta property="og:title" content="XuanKen Music Official" />
    <meta property="og:description" content="Nền tảng nghe nhạc trực tuyến" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch || originalFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {
        }

        window.addEventListener('error', function(event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
  </head>
  <body style="background-color: #170f23; color: #ffffff;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
