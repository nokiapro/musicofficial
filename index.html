    <!-- Pre-script: Prevent extension conflicts with window.fetch getter/setter -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var _currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(fn) {
                  _currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}

        // Global error shield against 3rd-party browser extensions attempting to override window.fetch
        window.addEventListener('error', function(event) {
          if (
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('only a getter') !== -1
            )) ||
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            (event.reason.message.indexOf('Cannot set property fetch') !== -1 ||
             event.reason.message.indexOf('only a getter') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

  </body>
