<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('xuanken_theme') || 'purple';
          document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {}
        window.addEventListener('error', function(event) {
          var file = (event && event.filename) || '';
          if (file.indexOf('chrome-extension://') !== -1 || file.indexOf('moz-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.stack || reason.message)) || String(reason || '');
          if (msg.indexOf('chrome-extension://') !== -1 || msg.indexOf('moz-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>XuanKen Music</title>
    <meta name="description" content="Trình phát & Cổng âm nhạc trực tuyến XuanKen Music: Nghe demo 60s, mua bản quyền MP3/WAV full chất lượng, quản lý kho bài hát Admin và đồng bộ Firebase." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
