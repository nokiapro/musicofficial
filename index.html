    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var _rawFetch = window.fetch;
          var _activeFetch = _rawFetch ? function () {
            return _rawFetch.apply(window, arguments);
          } : null;
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return _activeFetch;
                },
                set: function (fn) {
                  _activeFetch = fn;
                },
              });
            } catch (e) {}
          }
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return _activeFetch;
              },
              set: function (fn) {
                _activeFetch = fn;
              },
            });
          } catch (e) {}
        } catch (err) {}
        window.addEventListener('error', function(event) {
          if (event) {
            var filename = event.filename || '';
            var message = event.message || '';
            if (filename.indexOf('chrome-extension://') !== -1 || message.indexOf('Cannot set property fetch') !== -1) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = String(event.reason.message || event.reason);
            var stack = String(event.reason.stack || '');
            if (stack.indexOf('chrome-extension://') !== -1 || msg.indexOf('Cannot set property fetch') !== -1) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
